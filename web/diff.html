<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>校验树差异定位</title>
<style>
body{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;margin:24px;color:#263238}
h1{font-size:20px}
h2{font-size:15px;margin-top:24px}
#summary{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;max-width:900px}
#summary dt{font-weight:600}
#summary dd{margin:0;font-family:ui-monospace,monospace;word-break:break-all}
#tree{border:1px solid #eceff1;background:#fafafa;width:100%;max-width:1200px;height:auto}
line{stroke:#90a4ae;stroke-width:1.5}
.node circle{fill:#ffb300;stroke:#e65100;stroke-width:1.5}
.node.changed-block circle{fill:#e53935;stroke:#b71c1c}
.node text{font:10px ui-monospace,monospace;text-anchor:middle;fill:#37474f}
#paths li{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<h1>校验树差异定位</h1>
<dl id="summary"><dt>块数</dt><dd>17</dd><dt>变化块</dt><dd>3 5 9 12</dd><dt>重算数</dt><dd>10</dd><dt>根</dt><dd>6d9fa393e5fe340ecf1173d71f35aea3854a07f32c988a09569461dfce121cb5</dd></dl>
<svg id="tree" viewBox="0 0 440 390" role="img" aria-label="变化路径">
<line data-edge="1:0/0:3" x1="70" y1="330" x2="70" y2="240"/>
<line data-edge="1:1/0:5" x1="170" y1="330" x2="170" y2="240"/>
<line data-edge="1:2/0:9" x1="270" y1="330" x2="270" y2="240"/>
<line data-edge="1:3/0:12" x1="370" y1="330" x2="370" y2="240"/>
<line data-edge="2:0/1:0" x1="70" y1="240" x2="220" y2="150"/>
<line data-edge="2:0/1:1" x1="170" y1="240" x2="220" y2="150"/>
<line data-edge="2:0/1:2" x1="270" y1="240" x2="220" y2="150"/>
<line data-edge="2:0/1:3" x1="370" y1="240" x2="220" y2="150"/>
<line data-edge="3:0/2:0" x1="220" y1="150" x2="220" y2="60"/>
<g class="node changed-block" data-node="0:3" transform="translate(70,330)"><circle r="9"/><text y="24">0:3</text></g>
<g class="node changed-block" data-node="0:5" transform="translate(170,330)"><circle r="9"/><text y="24">0:5</text></g>
<g class="node changed-block" data-node="0:9" transform="translate(270,330)"><circle r="9"/><text y="24">0:9</text></g>
<g class="node changed-block" data-node="0:12" transform="translate(370,330)"><circle r="9"/><text y="24">0:12</text></g>
<g class="node changed" data-node="1:0" transform="translate(70,240)"><circle r="9"/><text y="24">1:0</text></g>
<g class="node changed" data-node="1:1" transform="translate(170,240)"><circle r="9"/><text y="24">1:1</text></g>
<g class="node changed" data-node="1:2" transform="translate(270,240)"><circle r="9"/><text y="24">1:2</text></g>
<g class="node changed" data-node="1:3" transform="translate(370,240)"><circle r="9"/><text y="24">1:3</text></g>
<g class="node changed" data-node="2:0" transform="translate(220,150)"><circle r="9"/><text y="24">2:0</text></g>
<g class="node changed" data-node="3:0" transform="translate(220,60)"><circle r="9"/><text y="24">3:0</text></g>
</svg>
<section><h2>变化块路径</h2>
<ul id="paths"><li>块 3：0/0/3</li><li>块 5：0/1/1</li><li>块 9：0/2/1</li><li>块 12：0/3/0</li></ul>
</section>
</body>
</html>
